services:
  z7rss:
    build: .
    container_name: z7rss
    ports:
      - "${HOST_PORT:-39118}:${PORT:-39018}"
    environment:
      APP_NAME: ${APP_NAME:-Z7 RSS}
      APP_URL: ${APP_URL:-http://localhost:39118}
      PORT: ${PORT:-39018}
      DB_PATH: ${DB_PATH:-/app/data/rss.db}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-30}
      MAINTENANCE_INTERVAL_MINUTES: ${MAINTENANCE_INTERVAL_MINUTES:-360}
      DATABASE_BACKUP_ENABLED: ${DATABASE_BACKUP_ENABLED:-true}
      DATABASE_BACKUP_RETENTION_DAYS: ${DATABASE_BACKUP_RETENTION_DAYS:-14}
      DATABASE_BACKUP_MAX_FILES: ${DATABASE_BACKUP_MAX_FILES:-24}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-30}
      AUDIT_LOG_MAX_ENTRIES: ${AUDIT_LOG_MAX_ENTRIES:-5000}
      REFRESH_RUN_RETENTION_DAYS: ${REFRESH_RUN_RETENTION_DAYS:-14}
      REFRESH_RUN_MAX_ENTRIES: ${REFRESH_RUN_MAX_ENTRIES:-1000}
      CRAWL_TIMEOUT_MS: ${CRAWL_TIMEOUT_MS:-15000}
      USER_AGENT: ${USER_AGENT:-Z7RSSBot/0.1 (+https://localhost)}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-z7rss_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      APP_SECRET: ${APP_SECRET:-change-me-before-production}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      DEEPLX_API_URL: ${DEEPLX_API_URL:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-demo}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
